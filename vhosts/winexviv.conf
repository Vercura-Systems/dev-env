<VirtualHost *:80>
    ServerAdmin chidera@winexviv.com
    ServerName winexviv.test


DocumentRoot /var/www/html/base_station/public


<Directory /var/www/html/base_station/public/>
    Options Indexes FollowSymLinks MultiViews
    AllowOverride all
    Order allow,deny
    allow from all
</Directory>
       
	<FilesMatch \.php$>
		# From the Apache version 2.4.10 and above, use the SetHandler to run PHP as a fastCGI process server
		SetHandler "proxy:unix:/run/php/php7.2-fpm.sock|fcgi://localhost"
	</FilesMatch>

</VirtualHost>
