<VirtualHost *:80>
    ServerName api.academy-pro.local
    ServerAlias *.api.academy-pro.local
    DocumentRoot /var/www/html/Academy/academy-backend-new/public

    <Directory /var/www/html/Academy/academy-backend-new/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/academy-api-error.log
    CustomLog ${APACHE_LOG_DIR}/academy-api-access.log combined
</VirtualHost>
