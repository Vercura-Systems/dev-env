<VirtualHost *:80>
    ServerName olympiad.enuguwest.academy
    DocumentRoot /var/www/html/ngwo-olympiad

    <Directory /var/www/html/ngwo-olympiad>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        # Map /portal to /portal/index.html
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^portal/?$ portal/index.html [L]

        # Map /admin to /admin/index.html
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^admin/?$ admin/index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/olympiad-error.log
    CustomLog ${APACHE_LOG_DIR}/olympiad-access.log combined
</VirtualHost>
