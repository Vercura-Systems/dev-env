<VirtualHost *:80>
    ServerName api.bastion.test
    DocumentRoot /var/www/html/bastion/bastion-api/public

    <Directory /var/www/html/bastion/bastion-api/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Handle Reverb WebSocket Proxy
    ProxyPass /app/ ws://localhost:8082/app/
    ProxyPassReverse /app/ ws://localhost:8082/app/

    # Handle PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/api-bastion-error.log
    CustomLog ${APACHE_LOG_DIR}/api-bastion-access.log combined
</VirtualHost>
