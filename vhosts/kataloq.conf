# /etc/apache2/sites-available/kataloq.conf 
# Run: sudo a2ensite kataloq && sudo systemctl reload apache2 
# Requires: sudo a2enmod rewrite proxy proxy_http headers 

# ─── API: api.kataloq.test → Laravel on port 8000 ──────────────────────────── 
<VirtualHost *:80> 
    ServerName api.kataloq.test 

    ProxyPreserveHost On 
    ProxyPass / http://127.0.0.1:8000/ 
    ProxyPassReverse / http://127.0.0.1:8000/ 

    ErrorLog ${APACHE_LOG_DIR}/kataloq-api-error.log 
    CustomLog ${APACHE_LOG_DIR}/kataloq-api-access.log combined 
</VirtualHost> 

# ─── Storefront: *.kataloq.test → Next.js on port 3002 ─────────────────────── 
# Wildcard catches jsonventures.kataloq.test etc. 
<VirtualHost *:80> 
    ServerName kataloq.test 
    ServerAlias *.kataloq.test 

    ProxyPreserveHost On 
    ProxyPass / http://127.0.0.1:3002/ 
    ProxyPassReverse / http://127.0.0.1:3002/ 

    # Forward the original Host header so Next.js can read the subdomain 
    <IfModule mod_headers.c>
        RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e" env=HTTP_HOST 
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/kataloq-storefront-error.log 
    CustomLog ${APACHE_LOG_DIR}/kataloq-storefront-access.log combined 
</VirtualHost> 

# ─── Admin: admin.kataloq.test → Next.js admin on port 3005 ────────────────── 
<VirtualHost *:80> 
    ServerName admin.kataloq.test 
    ServerAlias app.kataloq.test 

    ProxyPreserveHost On 
    ProxyPass / http://127.0.0.1:3005/ 
    ProxyPassReverse / http://127.0.0.1:3005/ 

    ErrorLog ${APACHE_LOG_DIR}/kataloq-admin-error.log 
    CustomLog ${APACHE_LOG_DIR}/kataloq-admin-access.log combined 
</VirtualHost> 

# ─── NOTES ──────────────────────────────────────────────────────────────────── 
# Start Laravel dev server on port 8000: 
#   cd /var/www/html/kataloq/api && php artisan serve --port=8000 
# 
# Start Storefront on port 3002: 
#   cd /var/www/html/kataloq/storefront && npm run dev -- --port=3002 
# 
# Start Admin on port 3005: 
#   cd /var/www/html/kataloq/admin && npm run dev -- --port=3005 
# 
# Enable required Apache modules: 
#   sudo a2enmod rewrite proxy proxy_http headers 
#   sudo systemctl reload apache2 
