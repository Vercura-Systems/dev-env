<VirtualHost *:80>
    ServerName academy-pro.local
    ServerAlias *.academy-pro.local

    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/academy-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/academy-frontend-access.log combined
</VirtualHost>
