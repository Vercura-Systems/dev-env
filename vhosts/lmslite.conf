<VirtualHost *:80>

	ServerAdmin chidera@winexviv.com
	ServerName servicepack.test 
	####ServerAlias 192.168.0.132
	ServerAlias servicepack.test
	DocumentRoot /var/www/html/service_pack/frontend

	ErrorDocument 404 /views/errors/apache404.html

        <Directory /var/www/html/service_pack/frontend/>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride all
                Order allow,deny
                allow from all
        </Directory>

        Alias /server "/var/www/html/service_pack/server"

        <Directory /var/www/html/service_pack/server/>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride all
                Order allow,deny
                allow from all
        </Directory>

        Alias /assets "/var/www/html/service_pack/assets"
        <Directory "/var/www/html/service_pack/assets">
                Options Indexes FollowSymLinks Multiviews
                Require all granted
                AllowOverride All
                Order allow,deny
                Allow from all
        </Directory>
        
       
	<FilesMatch \.php$>
		# From the Apache version 2.4.10 and above, use the SetHandler to run PHP as a fastCGI process server
		SetHandler "proxy:unix:/run/php/php7.2-fpm.sock|fcgi://localhost"
	</FilesMatch>

 </VirtualHost>
 <VirtualHost *:443>
	
	ServerAdmin chidera@winexviv.com
	ServerName servicepack.test 
	####ServerAlias 192.168.0.132
	ServerAlias servicepack.test
	DocumentRoot /var/www/html/service_pack/frontend

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
	SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

	ErrorDocument 404 /views/errors/apache404.html

        <Directory /var/www/html/service_pack/frontend/>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride all
                Order allow,deny
                allow from all
        </Directory>

        Alias /server "/var/www/html/service_pack/server"

        <Directory /var/www/html/service_pack/server/>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride all
                Order allow,deny
                allow from all
        </Directory>

        Alias /assets "/var/www/html/service_pack/assets"
        <Directory "/var/www/html/service_pack/assets">
                Options Indexes FollowSymLinks Multiviews
                Require all granted
                AllowOverride All
                Order allow,deny
                Allow from all
        </Directory>
        
       
	<FilesMatch \.php$>
		# From the Apache version 2.4.10 and above, use the SetHandler to run PHP as a fastCGI process server
		SetHandler "proxy:unix:/run/php/php7.2-fpm.sock|fcgi://localhost"
	</FilesMatch>

</VirtualHost>

 
